name: new_tag_and_seal_flutter_app

description: "LiveStock Tagging and Sealing App"

publish_to: 'none' 
version: 1.1.2+8

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  icons_plus: ^5.0.0
  liquid_swipe: ^3.1.0
  
  # State Management & Path Manager
  provider: ^6.1.2
  path: ^1.9.1
  
  # Local Database and Path Provider
  drift: ^2.16.0
  drift_flutter: ^0.1.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  
  # UI Components
  google_nav_bar: ^5.0.6
  flutter_slidable: ^3.1.0
  smooth_page_indicator: ^1.2.0
  
  # Localization & Scanner
  intl: ^0.20.2
  mobile_scanner: ^3.5.5
  
  # HTTP Client
  http: ^1.2.0
  
  # Notifications, Timezone, Alarm, Audio, File Picker
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  alarm: ^5.1.5
  just_audio: ^0.9.37
  file_picker: ^8.1.2
  
  # Phone Number Input & Internet Connectivity
  intl_phone_field: ^3.2.0
  connectivity_plus: ^7.0.0
  
  # Location Services & Permission Handler
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  
  # Bluetooth
  flutter_blue_plus: ^1.32.12
  
  # Package Info
  package_info_plus: ^8.0.2
  
  # URL Launcher
  url_launcher: ^6.3.1
  
  # Charts
  fl_chart: ^0.69.0

  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  
  # Code Generation for Drift
  drift_dev: ^2.16.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter:

  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/welcome/
    - assets/images/logos/
    - assets/images/editorial/
    - assets/images/dashboard/
    - assets/images/icons/
    - assets/images/placeholders/
    - assets/animations/
    - assets/animations/gifs/
    - assets/fonts/

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.OTF
        - asset: assets/fonts/SFPRODISPLAYREGULAR.OTF

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logos/my-ngombe-logo-3-small.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4C7972"
  adaptive_icon_foreground: "assets/images/logos/my-ngombe-logo-3-small.png"
  remove_alpha_ios: true
  background_color_ios: "#4C7972"
